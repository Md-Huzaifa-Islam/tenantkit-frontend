name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tenantkit-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    # Boots the real stack: the backend repo's compose (Postgres + API) and this repo's
    # web image, then runs Playwright. Cross-repo checkout needs the backend repo to be
    # public (or a BACKEND_REPO_TOKEN secret with read access).
    if: ${{ !github.event.repository.private || vars.E2E_WITH_TOKEN == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Md-Huzaifa-Islam/tenantkit-backend
          path: .backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - name: Start backend (Postgres + API)
        working-directory: .backend
        run: |
          echo "AUTH_RATE_LIMIT_PER_MINUTE=1000" > .env
          docker compose up -d --build --wait
      - name: Start web
        run: docker compose up -d --build --wait
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose -f .backend/docker-compose.yml logs api --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    # Runs only for pushes to main, after the checks pass. The VPS key is locked to a
    # forced command in ~deploy/.ssh/authorized_keys (git pull + compose up for this
    # repo only), so the workflow cannot choose what runs on the server.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes deploy@"$VPS_HOST"
